# Copy to .github/workflows/automation-smoke.yml in the intended repository.
name: Automation browser smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r automation-foundation/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python automation-foundation/smoke_test.py
