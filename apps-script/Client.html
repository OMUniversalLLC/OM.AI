<script>
(function () {
'use strict';
const NAV=[['overview','◈','Overview'],['radar','◉','OM Radar'],['impact','⌘','OM Impact'],['insights','▥','OM Insights'],['predict','⌁','OM Predict'],['alerts','◇','OM Alerts'],['watch','◌','OM Watch'],['cameras','▣','OM Cameras'],['wifi','⌁','OM WiFi'],['pc','▣','OM PC'],['orchestrator','✦','OM Orchestrator'],['control','☷','OM Control'],['advisor','✦','OM Advisor'],['finance','＄','OM Finance'],['fuel','⛽','Fuel Sources'],['compliance','▣','Compliance'],['settings','⚙','Settings']];
const titleMap=Object.fromEntries(NAV.map(x=>[x[0],x[2]]));
const demo=Boolean(window.OMAI_DEMO);
const state={view:'overview',data:null,storeId:null,busy:false,chat:[],mobileMenu:false,scenario:0};
const $=s=>document.querySelector(s);
const esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtMoney=x=>x==null||x===''?'—':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(Number(x));
const fmtInt=x=>x==null?'—':new Intl.NumberFormat('en-US',{maximumFractionDigits:0}).format(Number(x));
const shortDate=x=>!x?'—':String(x).slice(0,10);
const safeUrl=x=>/^https:\/\//i.test(String(x||''))?String(x):'#';
const pill=(label,type)=>`<span class="pill ${esc(type||'')}">${esc(label)}</span>`;
const empty=(title,desc)=>`<div class="empty"><strong>${esc(title)}</strong>${esc(desc)}</div>`;
const iconFor=x=>x==='weather_alert'?'⛈':x==='traffic_flow'?'🚙':x==='traffic_incident'?'🚧':x==='news_mention'?'📰':x==='weather_forecast'?'☁':'●';
const has=x=>Array.isArray(x)&&x.length>0;
const pct=x=>x==null?'—':`${x>0?'+':''}${Number(x).toFixed(1)}%`;
function api(method,...args){
  if(demo)return Promise.resolve(method==='getOmAiDashboard'?window.OMAI_DEMO_DATA:{ok:false,mode:'demo',answer:'This is an illustrative preview. Connect Google Apps Script to use live data and write records.'});
  return new Promise((resolve,reject)=>{
    if(!window.google||!google.script||!google.script.run){reject(Error('Open the deployed Apps Script web app, not this source HTML directly.'));return;}
    google.script.run.withSuccessHandler(resolve).withFailureHandler(err=>reject(new Error(err&&err.message||'Service unavailable')))[method](...args);
  });
}
function notify(msg,bad=false){const host=$('#toast-host');host.innerHTML=`<div class="toast" style="${bad?'background:#a74150':''}">${esc(msg)}</div>`;setTimeout(()=>{host.innerHTML='';},4200);}
function renderShell(){
  const d=state.data;const nav= NAV.map((n,i)=>`${i===0||i===4?`<div class="nav-title">${i===0?'COMMAND CENTER':'WORKSPACE'}</div>`:''}<button class="nav-btn ${state.view===n[0]?'active':''}" data-nav="${n[0]}"><span class="nav-ico">${n[1]}</span><span class="nav-text">${n[2]}</span></button>`).join('');
  const stores=(d.stores||[]).map(s=>`<option value="${esc(s.store_id)}" ${s.store_id===state.storeId?'selected':''}>${esc(s.name)}</option>`).join('');
  $('#app').className=''; $('#app').innerHTML=`${demo?'<div class="preview-flag">DEMO PREVIEW — Illustrative data only. No live feeds, no cloud persistence.</div>':''}
    <div class="shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">OM</span><span><div class="brand-name">OM <em>AI</em></div><div class="brand-sub">Intelligence platform</div></span></div>${nav}<div class="side-bottom"><div><span class="online-dot"></span>${demo?'Preview mode':'Private Google account'}</div><div style="margin-top:7px">${esc(d.user.name||d.user.email||'Manager')} · ${esc(d.user.role)}</div><div class="tiny">Internal business intelligence</div></div></aside>
    <main class="main"><header class="header"><div><div class="eyebrow">OM Universal / Intelligence Center</div><div class="page-heading" id="page-title">${esc(titleMap[state.view])}</div></div><div class="header-right"><select id="store-select" class="store-select" aria-label="Select store">${stores}</select><button class="btn" data-action="refresh" title="Update from private spreadsheet">↻ Refresh</button><button class="btn btn-primary" data-action="add:task">＋ New task</button></div></header>
    <div class="mobile-nav">${NAV.map(n=>`<button class="nav-btn ${state.view===n[0]?'active':''}" data-nav="${n[0]}"><span class="nav-text">${esc(n[2])}</span></button>`).join('')}</div>
    <div id="view" class="content"></div></main></div><div id="modal-mount"></div>`;
  $('.mobile-nav').style.display=window.innerWidth<=570?'flex':'none';
  renderView();
}
function renderView(){
  const node=$('#view');if(!node||!state.data)return;
  const views={overview:renderOverview,radar:renderRadar,impact:renderImpact,insights:renderInsights,predict:renderPredict,alerts:renderAlerts,watch:renderWatch,cameras:renderCameras,wifi:renderWifi,pc:renderPcIntelligence,orchestrator:renderOrchestrator,control:renderControl,advisor:renderAdvisor,finance:renderFinance,fuel:renderFuelSources,compliance:renderCompliance,settings:renderSettings};
  node.innerHTML=views[state.view]();
  $('#page-title').textContent=titleMap[state.view];
  document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===state.view));
}
function section(title,sub,right=''){return `<div class="section-top"><div><h2>${title}</h2><p>${sub}</p></div>${right}</div>`;}
function chart(rows,field,kind='sales'){
  const data=(rows||[]).filter(x=>Number.isFinite(Number(x[field]))&&x[field]!==null&&x[field]!=='').slice(-35);
  if(data.length<2)return empty('Not enough history','Add at least two dated records to see a trend.');
  let values=data.map(x=>Number(x[field])); let lo=Math.min(...values),hi=Math.max(...values);if(lo===hi){lo=lo*.8;hi=Math.max(hi*1.2,1);}let pad=(hi-lo)*.1||1;hi+=pad;lo=Math.max(0,lo-pad);
  const W=700,H=205,L=45,R=12,T=14,B=30;let x=i=>L+i*(W-L-R)/Math.max(1,values.length-1),y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const points=values.map((v,i)=>[x(i),y(v)]),line=points.map(p=>p.join(',')).join(' '),fill=`${x(0)},${H-B} ${line} ${x(values.length-1)},${H-B}`;
  let ticks=[0,.25,.5,.75,1].map(t=>`<line class="chart-grid" x1="${L}" y1="${T+(H-T-B)*t}" x2="${W-R}" y2="${T+(H-T-B)*t}"/><text class="chart-label" x="${L-7}" y="${T+(H-T-B)*t+3}" text-anchor="end">${Math.round(hi-(hi-lo)*t).toLocaleString('en-US')}</text>`).join('');
  let labels=[0,Math.floor((data.length-1)/2),data.length-1].map(i=>`<text class="chart-label" x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(shortDate(data[i].date).slice(5))}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(kind)} chart with ${data.length} data points">${ticks}<polygon class="chart-fill" points="${fill}"/><polyline class="chart-line" points="${line}"/>${points.map((p,i)=>i===points.length-1?`<circle class="chart-dot" cx="${p[0]}" cy="${p[1]}" r="4"/>`:'').join('')}${labels}</svg>`;
}
function kpi(icon,label,value,hint){return `<article class="kpi"><div class="top"><div class="label">${label}</div><div class="metric-icon">${icon}</div></div><div class="value">${value}</div><div class="hint">${hint}</div></article>`;}
function renderOverview(){let d=state.data,s=d.summary;
  const latestLabel=s.latest_date?`Latest record · ${shortDate(s.latest_date)}`:'No connected sales data';
  return `<div class="hero"><div><div class="eyebrow" style="color:#b2bdf6">INTELLIGENCE BEHIND EVERY DECISION</div><h1>Business clarity, before problems grow.</h1><p>Monitor what is happening inside and outside ${esc(d.store.name)}. Turn verified signals into actions and evidence-based forecasts.</p></div><div class="hero-icon">✦</div></div>
    <div class="kpis">${kpi('＄','Latest inside sales',fmtMoney(s.latest_sales),latestLabel)}${kpi('♙','Latest customer count',fmtInt(s.latest_customers),latestLabel)}${kpi('⛽','Fuel gallons · last 7 entries',fmtInt(s.fuel_gallons_last7), 'Based on recorded sales days')}${kpi('⚑','Attention required',fmtInt(d.alerts.filter(x=>x.severity==='high').length),'High-priority indicators')}</div>
    <div class="grid-2"><div class="panel"><div class="panel-header"><div><h3>In-store sales trend</h3><div class="muted small">Dated sales records · not real-time POS</div></div>${pill(pct(s.change_pct),s.change_pct==null?'info':s.change_pct>=0?'ok':'high')}</div>${chart(s.series,'sales')}</div>
    <div class="panel"><div class="panel-header"><div><h3>Management attention</h3><div class="muted small">Highest-priority items</div></div><button class="btn btn-sm" data-nav="alerts">All alerts</button></div>${alertsList(d.alerts.slice(0,4))}</div></div>
    ${section('Operations snapshot','Useful indicators based on saved store records')}
    <div class="grid-3">${miniPanel('Low-stock items',s.low_stock_count,'Inventory items at/below reorder point','inventory')}${miniPanel('Open tasks',s.open_tasks,`${s.overdue_tasks} overdue`,'control')}${miniPanel('Vendor variance',fmtMoney(s.vendor_variance),'Absolute differences requiring review','insights')}</div>
    ${section('Recent external signals','Automatically fetched only after sources are refreshed')}
    <div class="panel">${signalList(d.signals.slice(0,4))}</div><div class="footer-note">Data captured: ${esc(d.timestamp)} · ${demo?'DEMO values are illustrative':'Private Google Sheet source'} · Predictions are estimates, not guarantees.</div>`;
}
function miniPanel(t,v,desc,view){return `<div class="panel"><div class="muted small">${t}</div><div style="font:800 24px Manrope;margin:9px 0">${v}</div><div class="small muted">${esc(desc)}</div><button class="btn btn-sm" data-nav="${view}" style="margin-top:14px">View details →</button></div>`;}
function alertsList(a){return !has(a)?empty('No alerts to display','This is not proof that there are no external incidents. Check data-source status.') : a.map(x=>`<div class="alert-row"><div class="signal-icon">${x.severity==='high'?'⚠':'◈'}</div><div class="grow"><div class="row-title">${esc(x.title)}</div><div class="row-description">${esc(x.details)}</div><div class="row-date">${esc(x.source||'Rule')} · ${esc(x.store_id||'')}</div></div>${pill(x.severity,x.severity)}</div>`).join('');}
function signalList(rows){return !has(rows)?empty('No source data yet','Click “Refresh sources” to fetch weather, traffic (optional) and news feeds.'):rows.map(x=>`<div class="signal-row"><div class="signal-icon">${iconFor(x.kind)}</div><div class="grow"><div class="row-title">${esc(x.title)}</div><div class="row-description">${esc(x.details).slice(0,250)}</div><div class="row-date">${esc(x.source)} · ${esc(x.observed_at||'')}</div></div>${x.source_url?`<a href="${esc(safeUrl(x.source_url))}" target="_blank" rel="noopener noreferrer" class="small">Source ↗</a>`:''}</div>`).join('');}
function renderRadar(){let d=state.data,point=Number(d.store.latitude)&&Number(d.store.longitude),coord=point?`${Number(d.store.latitude)},${Number(d.store.longitude)}`:null;
  let maps=coord?`https://www.google.com/maps/@${coord},14z/data=!5m1!1e1`:'https://fl511.com/';
  let weather=d.signals.find(x=>x.kind==='weather_forecast'),road=d.signals.find(x=>x.kind==='traffic_flow');
  return `<div class="hero" style="min-height:132px"><div><div class="eyebrow" style="color:#b2bdf6">EXTERNAL ENVIRONMENT MONITORING</div><h1>OM Radar</h1><p>Road construction, traffic speeds, storms and relevant local news. Signals are not independently verified business impacts.</p></div><div class="hero-icon">◎</div></div>
  ${section('Live-source integrations','Refresh manually or install the hourly Apps Script trigger',`<button class="btn btn-primary" data-action="refreshSources">↻ Refresh sources</button>`)}
  <div class="grid-3"><div class="source-card"><strong>☁ National Weather Service</strong><small>${weather?esc(weather.title):'No forecast fetched yet'}</small><a href="https://forecast.weather.gov/" target="_blank">NWS forecast ↗</a></div>
  <div class="source-card"><strong>🚙 TomTom Road Traffic</strong><small>${road?`${esc(road.value)} km/h · ${esc(road.details).slice(0,90)}`:esc(d.integration.traffic)}</small><a href="${esc(maps)}" target="_blank">Google traffic map ↗</a></div>
  <div class="source-card"><strong>📰 Local & national news</strong><small>RSS mentions must be fact-checked; not all headlines affect store demand.</small><a href="https://news.google.com/" target="_blank">Browse news ↗</a></div></div>
  <div class="grid-2" style="margin-top:17px"><div class="panel"><div class="panel-header"><div><h3>${esc(d.store.name)}</h3><div class="muted small">${esc(d.store.address||'Address not configured')}</div></div>${pill(point?'Location configured':'Set coordinates',point?'ok':'medium')}</div><div class="map-panel"><div class="map-pin">⛽ ${esc(d.store.name)}</div></div><div class="filter-bar" style="margin-top:14px"><a class="btn btn-sm" href="${esc(maps)}" target="_blank">Traffic map ↗</a><a class="btn btn-sm" href="https://fl511.com/" target="_blank">FL511 ↗</a><a class="btn btn-sm" href="https://radar.weather.gov/" target="_blank">Weather radar ↗</a></div><div class="notice">A road speed measurement does not count vehicles passing the store. Exact vehicle volume needs FDOT counts or a dedicated sensor.</div></div>
  <div class="panel"><div class="panel-header"><div><h3>Tracked construction and events</h3><div class="muted small">Manually verified operational events</div></div><button class="btn btn-sm" data-action="add:event">＋ Add event</button></div>${has(d.events)?d.events.slice(0,8).map(x=>`<div class="signal-row"><div class="signal-icon">🚧</div><div class="grow"><div class="row-title">${esc(x.title)}</div><div class="row-description">${esc(x.description)}</div><div class="row-date">${esc(x.start_date||x.event_date)} · ${esc(x.status)}</div></div></div>`).join(''):empty('No verified events saved','Add official roadwork notices or business-impact events manually.')}</div></div>
  ${section('Source timeline','Weather forecasts, traffic incidents and news mentions')}
  <div class="panel">${signalList(d.signals.slice(0,40))}</div>`;
}
function renderImpact(){let d=state.data,items=d.impacts||[];
  return `<div class="hero" style="min-height:132px"><div><div class="eyebrow" style="color:#b2bdf6">EXPLAINABLE EARLY WARNING</div><h1>OM Impact</h1><p>Connect internal operating problems with recent external signals. Priorities reflect relevance, not proven sales causation.</p></div><div class="hero-icon">◇</div></div>
  ${section('What may affect this store','Impact watchlist: review evidence before taking action')}
  <div class="kpis">${kpi('⚠','High-priority signals',items.filter(x=>x.level==='high').length,'Source-derived urgency')}${kpi('◈','Medium-priority signals',items.filter(x=>x.level==='medium').length,'Review relevance')}${kpi('⌁','Unverified news mentions',items.filter(x=>x.verified===false).length,'Do not treat as confirmed')}${kpi('▥','Total factors',items.length,'Internal + external indicators')}</div>
  <div class="panel">${!has(items)?empty('No impact factors found','Load verified historical data, external reports and inventory counts to build a watchlist.'):items.map(x=>`<div class="alert-row"><div class="signal-icon">${x.type==='Weather'?'☁':x.type==='Traffic'?'🚙':x.type==='Inventory'?'▣':x.type==='Purchases'?'＄':'◇'}</div><div class="grow"><div class="row-title">${esc(x.title)} <span class="tiny muted">· ${esc(x.type)}</span></div><div class="row-description"><strong>Evidence:</strong> ${esc(x.evidence)}</div><div class="row-description"><strong>Recommended check:</strong> ${esc(x.action)}</div><div class="row-date">${esc(x.source)} · ${x.verified?'Source or store record':'Unverified headline'}</div></div>${pill(x.level,x.level)}</div>`).join('')}</div>
  <div class="notice warn">Relevance does not imply causality. To estimate a measurable effect, compare matching days and control for seasonality, fuel prices, promotions and other changes.</div>`;
}
function renderInsights(){let d=state.data,s=d.summary;
 const tSales=has(d.sales)?`<div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th class="num">Inside sales</th><th class="num">Customers</th><th class="num">Transactions</th><th class="num">Fuel gallons</th><th class="num">Lottery</th></tr></thead><tbody>${d.sales.slice(0,60).map(x=>`<tr><td>${esc(x.date)}</td><td class="num">${fmtMoney(x.inside_sales)}</td><td class="num">${fmtInt(x.customers)}</td><td class="num">${fmtInt(x.transactions)}</td><td class="num">${fmtInt(x.fuel_gallons)}</td><td class="num">${fmtMoney(x.lottery_sales)}</td></tr>`).join('')}</tbody></table></div>`:empty('No sales data','Enter daily sales or import a normalized historical Sheet.');
 const tVendors=has(d.vendors)?`<div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Vendor</th><th>Invoice</th><th class="num">Invoice total</th><th class="num">Net expected</th><th class="num">Audit</th><th class="num">Variance</th><th>Status</th></tr></thead><tbody>${d.vendors.slice(0,60).map(x=>{let expected=Number(x.invoice_total)-Number(x.discount)-Number(x.credit),diff=Number(x.audit_total)-expected;return `<tr><td>${esc(x.date)}</td><td>${esc(x.vendor)}</td><td>${esc(x.invoice_number)}</td><td class="num">${fmtMoney(x.invoice_total)}</td><td class="num">${fmtMoney(expected)}</td><td class="num">${fmtMoney(x.audit_total)}</td><td class="num">${Math.abs(diff)>.01?pill(fmtMoney(diff),'high'):pill('$0.00','ok')}</td><td>${esc(x.status)}</td></tr>`;}).join('')}</tbody></table></div>`:empty('No vendor audits','Add an invoice audit to compare against net expected invoice value.');
 return `${section('Sales performance','Trend, volume and recorded transactions',`<button class="btn btn-primary" data-action="add:sale">＋ Add daily sales</button>`)}<div class="grid-2"><div class="panel"><div class="panel-header"><div><h3>Daily inside sales</h3><div class="muted small">Last 35 records</div></div></div>${chart(s.series,'sales')}</div><div class="panel"><h3>Sales baseline</h3><div style="font:800 26px Manrope;margin:15px 0">${fmtMoney(s.sales_last7)}</div><div class="muted small">Sum of last 7 recorded days</div><div class="notice">Prior 7 recorded days: ${fmtMoney(s.sales_prev7)} · change ${pct(s.change_pct)}. Missing dates can distort comparisons.</div><div class="muted small">Latest average ticket: ${fmtMoney(s.latest_avg_ticket)}</div></div></div>
 ${section('Daily sales records','Store-level daily report')}${tSales}
 ${section('Vendor audit and discount reconciliation','Audit variance = audited − (invoice − discount − credit)',`<button class="btn" data-action="add:vendor">＋ Add invoice audit</button>`)}${tVendors}`;
}
function renderPredict(){let d=state.data,f=d.forecast;return `${section('Seven-day sales baseline','Recency-weighted comparable weekdays; not an AI-generated guarantee')}
 <div class="grid-2"><div class="panel"><div class="panel-header"><div><h3>Expected inside-store sales</h3>${pill(f.status==='baseline'?'Baseline available':'Insufficient data',f.status==='baseline'?'ok':'medium')}</div></div>
 ${f.status==='baseline'?chart(f.points.map(x=>({...x,sales:x.expected})).filter(x=>x.sales!=null),'sales','forecast'):empty('Historical data required',f.note)}</div>
 <div class="panel"><h3>Methodology</h3><p>${esc(f.method)}</p><div class="notice">${esc(f.note)}</div><p class="small">Available daily records: <strong>${fmtInt(f.available)}</strong>. At least ${fmtInt(f.required)} needed. For more reliable estimates, import 6–8 weeks or more and verify missing days.</p><p class="small">Weather, local events and fuel pricing can improve forecasts after historical data is aligned by date.</p></div></div>
 ${section('What-if customer traffic scenario','User-controlled assumption — NOT an actual forecast of traffic')}<div class="panel"><div class="grid-equal"><div><label for="scenario-range"><strong>Assumed change in customer visits:</strong> <span id="scenario-label">${state.scenario>0?'+':''}${state.scenario}%</span></label><input id="scenario-range" type="range" min="-30" max="30" step="5" value="${state.scenario}" ${f.status!=='baseline'?'disabled':''} style="width:100%;margin:20px 0"><div class="small muted">Assumes spend per customer remains unchanged. A sensitivity calculation only.</div></div><div><div class="muted small">Illustrative next-seven-day sales total</div><div id="scenario-value" style="font:800 24px Manrope">${f.status==='baseline'?fmtMoney(f.points.reduce((total,x)=>total+(Number(x.expected)||0),0)*(1+state.scenario/100)):'Not available'}</div></div></div></div>
 ${section('Daily estimates','Expected range is a heuristic sensitivity band, not a statistical confidence interval')}
 <div class="panel">${has(f.points)?`<div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th class="num">Expected sales</th><th class="num">Lower scenario</th><th class="num">Upper scenario</th><th class="num">Comparable weekdays</th></tr></thead><tbody>${f.points.map(x=>`<tr><td>${esc(x.date)}</td><td class="num">${fmtMoney(x.expected)}</td><td class="num">${fmtMoney(x.lower)}</td><td class="num">${fmtMoney(x.upper)}</td><td class="num">${fmtInt(x.sample)}</td></tr>`).join('')}</tbody></table></div>`:empty('No forecasts yet','Add the required sales history first.')}</div>`;}
function renderAlerts(){let d=state.data;return `${section('Early warnings','Rules built from your data. Verify sources and record status.',`<button class="btn" data-nav="radar">View sources →</button>`)}<div class="kpis">${kpi('⚠','High priority',d.alerts.filter(x=>x.severity==='high').length,'Review now')}${kpi('◈','Medium priority',d.alerts.filter(x=>x.severity==='medium').length,'Investigate')}${kpi('▤','Informational',d.alerts.filter(x=>x.severity==='info').length,'Data quality and context')}${kpi('☷','Total alerts',d.alerts.length,'Current computed rules')}</div><div class="panel">${alertsList(d.alerts)}</div><div class="notice warn">A missing API response is not an “all clear.” Road-closure and weather alerts should be verified with official providers.</div>`;}
function renderWatch(){let d=state.data;return `${section('Incidents and surveillance notes','Store incidents and follow-up status',`<button class="btn btn-primary" data-action="add:incident">＋ Report incident</button>`)}<div class="panel">${!has(d.incidents)?empty('No incidents recorded','Log relevant employee safety, theft, equipment and operational incidents.'):d.incidents.map(x=>`<div class="alert-row"><div class="signal-icon">⚑</div><div class="grow"><div class="row-title">${esc(x.category||'Incident')} · ${esc(x.date)}</div><div class="row-description">${esc(x.description)}</div><div class="row-date">${esc(x.status)}</div></div>${pill(x.severity,x.severity==='High'?'high':x.severity==='Medium'?'medium':'info')}</div>`).join('')}</div><div class="notice">Do not upload customer ID documents, medical records, or raw surveillance footage to this tool. Keep sensitive evidence in your approved restricted systems.</div>`;}
function renderCameras(){
 const d=state.data,cv=d.cameras||{date:'',hasData:false,metrics:{},cameras:[],hourly:[],checks:[],monitoredOnline:0,cameraCount:0,notes:[]};
 const m=cv.metrics||{}, n=k=>cv.hasData&&Object.prototype.hasOwnProperty.call(m,k)?fmtInt(m[k]):'—';
 const cards=(cv.cameras||[]).map(c=>{
   const status=c.status==='online'?'Online · heartbeat':c.status==='stale'?'Stale heartbeat':c.status==='offline'?'Offline reported':'Not connected';
   const task=(cv.checks||[]).find(x=>x.camera_id===c.camera_id);
   return `<article class="cam-card"><div class="cam-head"><div><div class="cam-id">${esc(c.camera_id)}</div><strong>${esc(c.name)}</strong></div>${pill(demo?'DEMO':status,c.status==='online'?'ok':c.status==='offline'?'high':'info')}</div>
     <div class="cam-screen"><div class="cam-icon">▧</div><span>${demo?'ILLUSTRATIVE CAMERA TILE':'NO LIVE FEED EMBEDDED'}</span></div>

function pcMetric(value,suffix=''){return value===null||value===undefined||value===''?'Not measured':`${Number(value).toFixed(1)}${suffix}`;}
function pcHealthGauge(name,value,limit){
 const observed=value!==null&&value!==undefined&&value!==''&&Number.isFinite(Number(value));
 const n=observed?Number(value):null, level=!observed?'unconfigured':n>=limit?'critical':n>=limit*.8?'elevated':'normal';
 return `<div class="pc-health-bar"><div class="pc-health-caption"><strong>${esc(name)}</strong><span>${observed?esc(n.toFixed(1))+'%':'Not measured'}</span></div><div class="pc-track"><div class="pc-fill ${level}" style="width:${observed?Math.min(100,Math.max(0,n)):0}%"></div></div></div>`;
}

<div class="panel">${!has(d.operations)?empty('No operating metrics','Add a measurement such as ATM withdrawals, car wash count or pump downtime.'):`<div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Area</th><th>Metric</th><th class="num">Value</th><th>Unit</th><th>Notes</th></tr></thead><tbody>${d.operations.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.area)}</td><td>${esc(x.metric)}</td><td class="num">${fmtInt(x.value)}</td><td>${esc(x.unit)}</td><td>${esc(x.notes)}</td></tr>`).join('')}</tbody></table></div>`}</div>`;}
function renderCompliance(){let d=state.data;return `${section('Permit and deadline tracker','Tobacco, beer, hemp, fuel, safety, tax and annual renewals',`<button class="btn btn-primary" data-action="add:compliance">＋ Add deadline</button>`)}
<div class="panel">${!has(d.compliance)?empty('No deadlines entered','Add actual renewal and filing dates from official records. Do not rely on generic assumed deadlines.'):`<div class="table-wrap"><table class="table"><thead><tr><th>Deadline</th><th>Requirement</th><th>Category</th><th>Owner</th><th>Status</th></tr></thead><tbody>${d.compliance.map(x=>`<tr><td>${esc(x.due_date)}</td><td>${esc(x.name)}</td><td>${esc(x.category)}</td><td>${esc(x.owner)}</td><td><select class="store-select" style="min-width:130px" data-compliance="${esc(x.id)}" ${demo||d.user.role==='Viewer'?'disabled':''}>${['Open','In Progress','Completed','Cancelled'].map(st=>`<option ${x.status===st?'selected':''}>${st}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>`}</div><div class="notice warn">Dates must be confirmed against your licenses, filing frequency and government notices. This dashboard is a reminder system, not legal advice.</div>`;}
function renderFuelSources(){let fuel=state.data.fuelSources||{sources:[],latest:{},reports:[],observations:[],tasks:[]};
  const items=(fuel.sources||[]).map(x=>`<div class="alert-row"><div class="signal-icon">${x.source_id==='GasBuddy'?'⛽':x.source_id==='AAA'?'▥':'▤'}</div><div class="grow"><div class="row-title">${esc(x.name)}</div><div class="row-description">${esc(x.purpose)}</div><div class="row-date">${esc(x.capture_mode)} · ${esc(x.schedule)} · Last verified entry: ${esc((fuel.latest[x.source_id]||{}).last_seen||'none')}</div><a target="_blank" rel="noopener noreferrer" href="${safeUrl(x.url)}">View original website ↗</a></div>${pill((fuel.latest[x.source_id]||{}).count?'Recorded':'Needs data',(fuel.latest[x.source_id]||{}).count?'ok':'info')}</div>`).join('');
  const prices=(fuel.observations||[]).slice(0,16).map(x=>`<tr><td>${esc(x.price_date)}</td><td>${esc(x.source_id)}</td><td>${esc(x.area_station)}</td><td>${esc(x.grade)}</td><td>${esc(x.price_type)}</td><td>${fmtMoney(x.price_gallon)}</td><td><a href="${safeUrl(x.source_url)}" target="_blank" rel="noopener noreferrer">Original ↗</a></td></tr>`).join('');
  const reports=(fuel.reports||[]).slice(0,14).map(r=>`<tr><td>${esc(r.report_date)}</td><td>${esc(r.grade)}</td><td>${fmtMoney(r.cash_price)}</td><td>${fmtMoney(r.replacement_cost)}</td><td>${r.cash_margin==null?'—':fmtMoney(r.cash_margin)}</td><td>${r.aaa_average==null?'—':fmtMoney(r.aaa_average)}</td><td>${r.gasbuddy_low_cash==null?'—':fmtMoney(r.gasbuddy_low_cash)}</td><td>${esc(r.variance)}</td><td><a href="${safeUrl(r.evidence_url)}" target="_blank" rel="noopener noreferrer">Report ↗</a></td></tr>`).join('');
  const tasks=(fuel.tasks||[]).slice(0,25).map(t=>`<div class="alert-row"><div class="signal-icon">☷</div><div class="grow"><div class="row-title">${esc(t.source_id)} · ${esc(t.task_date)}</div><div class="row-description">${esc(t.task)}</div><div class="row-date">${esc(t.assigned_to)} · Due ${esc(t.due_date)}</div></div>${pill(t.status,t.status==='Completed'?'ok':'info')}${t.status!=='Completed'&&!demo&&state.data.user.role!=='Viewer'?`<button class="btn btn-sm" data-fuel-task="${esc(t.id)}">Complete + evidence</button>`:''}</div>`).join('');
  return `${section('Three fuel-source integrations','Each provider has a separate daily task, evidence, and data purpose.',`<button class="btn btn-primary" data-action="add:fuelObservation">＋ Add reference price</button><button class="btn" data-action="add:fuelReport">＋ Add store fuel report</button><button class="btn" data-action="extractFuel">▤ Extract screenshot draft</button>`)}
  <div class="panel">${items||empty('Sources unavailable','Run setupOmAi() again to add the new fuel tabs.')}</div>
  <div class="notice">No live web scraping is enabled. AAA values are averages, GasBuddy prices may be crowdsourced/outdated, and MostEdge must use your authorized export. Screenshots are audit evidence, not automatically extracted numbers.</div>
  ${section('MostEdge store fuel reports','Expected tank gallons = opening + delivered − sold. Margin values are per gallon and do not include all fees.')}
  <div class="panel" style="overflow:auto"><table class="table"><thead><tr><th>Date</th><th>Grade</th><th>Cash</th><th>Replacement cost</th><th>Cash margin</th><th>AAA</th><th>GasBuddy low</th><th>Tank variance</th><th>Evidence</th></tr></thead><tbody>${reports||'<tr><td colspan="9">No daily fuel reports entered.</td></tr>'}</tbody></table></div>
  ${section('Price evidence','Source, geography, grade and posted-time are stored alongside each entered price.')}
  <div class="panel" style="overflow:auto"><table class="table"><thead><tr><th>Date</th><th>Source</th><th>Market / station</th><th>Grade</th><th>Type</th><th>Price</th><th>Source</th></tr></thead><tbody>${prices||'<tr><td colspan="7">No verified reference prices entered.</td></tr>'}</tbody></table></div>
  ${section('Website tasks','A daily scheduled job can create one task per website and store.')}
  <div class="panel">${tasks||empty('No daily tasks yet','Owner runs installOmAiFuelDailyTasks() and scheduledOmAiFuelTasks() once.')}</div>`;
}
function renderSettings(){let d=state.data;return `${section('Integration & security','Private deployment configuration')}
 <div class="grid-equal"><div class="panel"><h3>Data storage</h3><p>Google Sheets · ${esc(d.store.name)}</p><a class="btn btn-sm" href="${esc(safeUrl(d.databaseUrl))}" target="_blank" rel="noopener">Open private database ↗</a><div class="notice">The public GitHub Pages site is NOT a safe place for private live store data. Keep the Apps Script app restricted and confirm account permissions.</div></div>
 <div class="panel"><h3>Services</h3>${Object.entries(d.integration).map(([key,val])=>`<div class="signal-row"><div class="grow"><div class="row-title">${esc(key.toUpperCase())}</div><div class="row-description">${esc(val)}</div></div>${pill(val==='configured'?'Configured':'Check setup',val==='configured'?'ok':'info')}</div>`).join('')}</div></div>
 ${section('Getting started','Owner-only setup tasks')}
 <div class="panel"><p>1. Create or open a dedicated Apps Script project. Add all .gs files and the three HTML files.</p><p>2. Set OWNER_EMAIL in Script Properties, then run <code>setupOmAi()</code>.</p><p>3. Add allowed emails and store permissions to the Users sheet. Share the private Sheet with those accounts.</p><p>4. Deploy as a web app: execute as <strong>user accessing the web app</strong>. Never publish sensitive data to the public website.</p><p>5. Add optional TOMTOM_API_KEY and GEMINI_API_KEY in Script Properties, then run <code>installOmAiHourlyMonitoring()</code>.</p><p class="small muted">Consult the supplied README for exact setup and authorized sharing guidance.</p></div>`;}
function field(name,label,type='text',required=false,opts=null,value=''){
 let control=opts?`<select name="${esc(name)}" ${required?'required':''}>${opts.map(v=>`<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(v)}</option>`).join('')}</select>`:type==='textarea'?`<textarea name="${esc(name)}" ${required?'required':''}>${esc(value)}</textarea>`:`<input name="${esc(name)}" type="${type}" value="${esc(value)}" ${type==='number'?'min="0" step="0.01"':''} ${required?'required':''}/>`;
 return `<div class="field ${type==='textarea'?'full':''}"><label>${esc(label)}</label>${control}</div>`;
}
function showForm(kind){if(demo){notify('This is a read-only preview. Deploy Apps Script to save real data.',true);return;}
 if(state.data.user.role==='Viewer'){notify('Viewer accounts cannot create records.',true);return;}
 let d=new Date(), date=d.toLocaleDateString('en-CA',{timeZone:'America/New_York'});if(!/^\d{4}-/.test(date))date=d.toISOString().slice(0,10);
 let fields='';let title={sale:'Record daily sales',task:'Create task',incident:'Report incident',vendor:'Audit vendor invoice',inventory:'Add inventory item',event:'Track external event',expense:'Record expense',fuelObservation:'Add AAA / GasBuddy price',fuelReport:'Enter MostEdge daily fuel report',metric:'Record operational metric',compliance:'Add compliance deadline'}[kind];
 if(kind==='fuelObservation')fields=field('price_date','Price date','date',true,null,date)+field('source_id','Source','text',true,['AAA','GasBuddy'],'AAA')+field('grade','Fuel grade','text',true,['Regular','Midgrade','Premium','Diesel'],'Regular')+field('area_station','Market area or competitor station','text',true)+field('price_type','Price type','text',true,['Average','Cash','Card','Unknown'],'Average')+field('price_gallon','Price per gallon ($)','number',true)+field('reported_at','Time shown on source (timezone)')+field('source_url','Original HTTPS page','url',true)+field('evidence_url','Screenshot / PDF Drive URL','url')+field('notes','Price context and verification','textarea');
 if(kind==='fuelReport')fields=field('report_date','Fuel report date','date',true,null,date)+field('grade','Fuel grade','text',true,['Regular','Midgrade','Premium','Diesel'],'Regular')+field('opening_gallons','Opening gallons','number',true)+field('delivered_gallons','Delivered gallons','number',true,null,'0')+field('sold_gallons','Sold gallons','number',true)+field('closing_gallons_actual','Actual closing gallons','number',true)+field('cash_price','Cash retail $/gal','number',true)+field('card_price','Card retail $/gal','number',true)+field('replacement_cost','Replacement cost $/gal','number')+field('source_report_id','MostEdge reference number')+field('evidence_url','Approved report screenshot / export URL','url')+field('notes','Verification notes','textarea');
 if(kind==='sale')fields=field('date','Reporting date','date',true,null,date)+field('inside_sales','Inside sales ($)','number',true,null,'0')+field('customers','Customer count','number',true,null,'0')+field('transactions','Transactions','number',true,null,'0')+field('fuel_gallons','Fuel gallons','number',true,null,'0')+field('fuel_sales','Fuel sales ($)','number',true,null,'0')+field('lottery_sales','Lottery sales ($)','number',true,null,'0')+field('car_wash_sales','Car wash sales ($)','number',true,null,'0')+field('notes','Notes','textarea');
 if(kind==='task')fields=field('title','Task title','text',true)+field('assigned_to','Assigned to')+field('due_date','Due date','date')+field('priority','Priority','text',true,['Low','Medium','High'],'Medium')+field('notes','Instructions','textarea');
 if(kind==='incident')fields=field('date','Incident date','date',true,null,date)+field('category','Category','text',true,['Theft','Safety','Equipment','Cash variance','Customer complaint','Other'],'Equipment')+field('severity','Severity','text',true,['Low','Medium','High'],'Medium')+field('description','What happened?','textarea',true);
 if(kind==='vendor')fields=field('date','Delivery date','date',true,null,date)+field('vendor','Vendor','text',true)+field('invoice_number','Invoice number')+field('invoice_total','Original invoice total ($)','number',true,null,'0')+field('discount','Discount ($)','number',true,null,'0')+field('credit','Credit ($)','number',true,null,'0')+field('audit_total','Audited amount ($)','number',true,null,'0')+field('status','Status','text',true,['Open','Followed up','Working','Resolved'],'Open')+field('notes','Issue / follow-up notes','textarea');
 if(kind==='expense')fields=field('date','Expense date','date',true,null,date)+field('category','Expense category','text',true,['Payroll','Utilities','Insurance','Maintenance','Store supplies','Bank fees','Taxes','Rent','Other'],'Maintenance')+field('vendor','Payee / vendor')+field('amount','Amount ($)','number',true,null,'0')+field('payment_method','Payment type','text',true,['EFT','Check','Cash','Card','Other'],'EFT')+field('notes','Notes','textarea');
 if(kind==='metric')fields=field('date','Observation date','date',true,null,date)+field('area','Operations area','text',true,['ATM','Lottery','Fuel','Car Wash','Power / Internet','Equipment','Waste','Payroll','Other'],'ATM')+field('metric','Metric name','text',true)+field('value','Value','number',true,null,'0')+field('unit','Unit (count, $, minutes, gallons...)')+field('notes','Notes','textarea');
 if(kind==='compliance')fields=field('name','Requirement / permit','text',true)+field('category','Category','text',true,['Tobacco','Alcohol','Hemp / Vape','Fuel / UST','Food','Lottery','Sales tax','Payroll tax','Annual report','Insurance','Fire / Safety','Other'],'Fuel / UST')+field('due_date','Verified due date','date',true,null,date)+field('owner','Responsible person')+field('notes','Reference / official source','textarea');
 if(kind==='inventory')fields=field('sku','UPC / SKU')+field('item_name','Item name','text',true)+field('department','Department')+field('on_hand','On hand','number',true,null,'0')+field('reorder_point','Reorder point','number',true,null,'0')+field('unit_cost','Unit cost ($)','number',true,null,'0')+field('retail_price','Retail price ($)','number',true,null,'0');
 if(kind==='event')fields=field('event_date','Reported date','date',true,null,date)+field('category','Category','text',true,['Roadwork','Weather','Regulation','Competitor','Event','Supply','Economy','Other'],'Roadwork')+field('title','Event title','text',true)+field('severity','Severity','text',true,['Low','Medium','High'],'Medium')+field('start_date','Start date','date')+field('end_date','End date','date')+field('status','Status','text',true,['Planned','Active','Closed'],'Planned')+field('source_url','Official source link','url')+field('description','Impact / details','textarea');
 $('#modal-mount').innerHTML=`<div class="modal-backdrop" data-action="close-modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-top"><h3>${esc(title)}</h3><button class="modal-close" type="button" data-action="close-modal">×</button></div><form id="entry-form" data-kind="${esc(kind)}"><div class="form-grid">${fields}</div><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">Cancel</button><button type="submit" class="btn btn-primary">Save record</button></div></form></div></div>`;
}
async function load(storeId){
 if(state.busy)return false;state.busy=true;let success=false;
 try {let data=await api('getOmAiDashboard',storeId);state.data=data;state.storeId=data.store.store_id;renderShell();success=true;}
 catch(e){if(!state.data){$('#app').innerHTML=`<div style="padding:8vw"><h1>OM AI is unavailable</h1><p>${esc(e.message)}</p><button class="btn" onclick="location.reload()">Try again</button></div>`;}else notify(e.message,true);}
 finally{state.busy=false;}
 return success;
}
document.addEventListener('click',async event=>{
 const nav=event.target.closest('[data-nav]');if(nav){state.view=nav.dataset.nav;renderView();return;}
 const b=event.target.closest('[data-action],[data-fuel-task],[data-camera-assign],[data-job-review],[data-job-ai]');if(!b)return;
 const act=b.dataset.action;
 if(act==='close-modal'){ $('#modal-mount').innerHTML='';return; }
 if(act==='close-modal-bg'&&event.target===b){$('#modal-mount').innerHTML='';return;}
 if(act && act.startsWith('add:')){showForm(act.slice(4));return;}
 if(b.dataset.jobAi){
   if(demo){notify('AI review is disabled in the fictional preview.');return;}
   const provider=prompt('Optional AI adviser for '+b.dataset.jobAi+': type gemini or openai. Only sanitized job metadata will be sent.','gemini');
   if(provider===null)return;
   if(!['gemini','openai'].includes(provider.toLowerCase())){notify('Choose gemini or openai.',true);return;}
   b.disabled=true;
   try{const r=await api('omAiReviewJob',state.storeId,b.dataset.jobAi,provider.toLowerCase());
     $('#modal-mount').innerHTML=`<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-top"><h3>AI task assessment · ${esc(r.provider)}</h3><button class="modal-close" data-action="close-modal">×</button></div><pre style="white-space:pre-wrap;overflow:auto;max-height:52vh">${esc(r.answer)}</pre><div class="notice warn">${esc(r.warning)}</div><button class="btn" data-action="close-modal">Close</button></div></div>`;
   }catch(e){notify(e.message,true);}finally{b.disabled=false;}return;
 }
 if(b.dataset.jobReview){
   if(demo){notify('Demo only: reviews do not change real jobs.');return;}
   const selection=prompt('Review '+b.dataset.jobReview+'. Enter Acknowledged, Investigating, Escalated, or Verified:','Investigating');
   if(selection===null)return;
   if(!['Acknowledged','Investigating','Escalated','Verified'].includes(selection)){notify('Choose an allowed review status.',true);return;}
   const note=prompt('Add a brief audit note (no passwords or personal data):','')||'';
   try{await api('reviewOmAiJob',state.storeId,b.dataset.jobReview,selection,note);await load(state.storeId);notify('Review saved. The job has not been executed or completed.');}
   catch(e){notify(e.message,true);}return;
 }
 if(b.dataset.cameraAssign){
   if(demo){notify('Demo only: connect private Apps Script and authorized accounts to assign observers.');return;}
   const observer=prompt('Name or team responsible for '+b.dataset.cameraAssign+':','');
   if(observer===null||!observer.trim())return;
   try{await api('assignOmCameraObserver',state.storeId,b.dataset.cameraAssign,observer);await load(state.storeId);notify('Camera observer saved.');}catch(e){notify(e.message,true);}return;
 }
 if(b.dataset.fuelTask){
   if(demo){notify('Preview only.',true);return;}
   let link=prompt('Paste the HTTPS link to the checked source page or screenshot (required to close task):','');
   if(link===null)return;
   if(!/^https:\/\//i.test(link)){notify('A valid HTTPS evidence link is required.',true);return;}
   try{await api('setOmAiFuelTaskStatus',state.storeId,b.dataset.fuelTask,'Completed',link);await load(state.storeId);notify('Fuel source task completed with evidence.');}
   catch(e){notify(e.message,true);} return;
 }
 if(act==='extractFuel'){
   if(demo){notify('Demo: extraction is available only after deploying the private Apps Script app and configuring Gemini.',true);return;}
   const id=prompt('Paste the Google Drive file ID or file link for your OWN authorized fuel report screenshot. The file will be sent to your configured Gemini account for a review-only extraction.','');
   if(!id)return;
   b.disabled=true;
   try{const draft=await api('previewOmFuelScreenshot',state.storeId,id);
     $('#modal-mount').innerHTML=`<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-top"><h3>Fuel screenshot • Review draft</h3><button class="modal-close" data-action="close-modal">×</button></div><div class="notice warn">${esc(draft.warning)}</div><pre style="max-height:48vh;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f7fb;padding:14px;border-radius:10px">${esc(JSON.stringify(draft,null,2))}</pre><div class="modal-actions"><button class="btn" data-action="close-modal">Close and verify values</button></div></div></div>`;
   }catch(e){notify(e.message,true);}finally{b.disabled=false;}return;
 }
 if(act==='refresh'){let ok=await load(state.storeId);if(ok)notify(demo?'Demo preview refreshed.':'Dashboard read from private Sheet.');return;}
 if(act==='refreshSources'){
  if(demo){notify('Preview mode: no live source requests are made.');return;}
  b.disabled=true;b.textContent='Refreshing sources…';
  try{let r=await api('refreshOmAiSources',state.storeId);await load(state.storeId);notify(r.sources.map(x=>x.source+': '+x.status).join(' · '));}catch(e){notify(e.message,true);}finally{b.disabled=false;b.textContent='↻ Refresh sources';}return;
 }
});
document.addEventListener('input',event=>{
 if(event.target.id==='scenario-range'){state.scenario=Number(event.target.value);let f=state.data.forecast,base=f.points.reduce((t,x)=>t+(Number(x.expected)||0),0);let label=$('#scenario-label'),val=$('#scenario-value');if(label)label.textContent=(state.scenario>0?'+':'')+state.scenario+'%';if(val)val.textContent=fmtMoney(base*(1+state.scenario/100));}
});
document.addEventListener('change',async event=>{
 if(event.target.id==='store-select'){await load(event.target.value);return;}
 if(event.target.matches('[data-compliance]')){let select=event.target;select.disabled=true;try{await api('setOmAiComplianceStatus',state.storeId,select.dataset.compliance,select.value);await load(state.storeId);notify('Compliance status saved.');}catch(e){notify(e.message,true);select.disabled=false;}return;}
 if(event.target.matches('[data-cam-check]')){
   const sel=event.target;sel.disabled=true;
   try{await api('setOmCameraCheckStatus',state.storeId,sel.dataset.camCheck,sel.value);await load(state.storeId);notify('Camera check status saved.');}
   catch(e){notify(e.message,true);sel.disabled=false;}return;
 }
 if(event.target.matches('[data-task]')){
  let select=event.target;select.disabled=true;
  try{await api('setOmAiTaskStatus',state.storeId,select.dataset.task,select.value);await load(state.storeId);notify('Task status saved.');}catch(e){notify(e.message,true);select.disabled=false;}
 }
});
document.addEventListener('submit',async event=>{
 if(event.target.id==='entry-form'){
   event.preventDefault();let form=event.target,kind=form.dataset.kind,payload=Object.fromEntries(new FormData(form).entries());payload.store_id=state.storeId;
   let btn=form.querySelector('[type=submit]');btn.disabled=true;btn.textContent='Saving…';
   try{let result=kind==='fuelObservation'?await api('saveOmAiFuelObservation',state.storeId,payload):kind==='fuelReport'?await api('saveOmAiFuelReport',state.storeId,payload):await api('saveOmAiRecord',kind,payload);if(!result.ok)throw Error(result.answer||'Record not saved.');$('#modal-mount').innerHTML='';await load(state.storeId);notify('Saved record '+result.id);}catch(e){notify(e.message,true);btn.disabled=false;btn.textContent='Save record';}
   return;
 }
 if(event.target.id==='chat-form'){
   event.preventDefault();let form=event.target,q=new FormData(form).get('question');if(!String(q).trim())return;
   state.chat.push({who:'user',text:String(q)});form.reset();renderView();
   try{let res=await api('askOmAi',state.storeId,q);state.chat.push({who:'ai',text:res.answer||'No answer was returned.'});}catch(e){state.chat.push({who:'ai',text:'AI service unavailable: '+e.message});}
   renderView();let box=$('#chat-messages');if(box)box.scrollTop=box.scrollHeight;
 }
});
load(null);
})();
</script>
