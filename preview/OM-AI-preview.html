function section(title,sub,right=''){return `<div class="section-top"><div><h2>${title}</h2><p>${sub}</p></div>${right}</div>`;}
function chart(rows,field,kind='sales'){
  const data=(rows||[]).filter(x=>Number.isFinite(Number(x[field]))&&x[field]!==null&&x[field]!=='').slice(-35);
  if(data.length<2)return empty('Not enough history','Add at least two dated records to see a trend.');
  let values=data.map(x=>Number(x[field])); let lo=Math.min(...values),hi=Math.max(...values);if(lo===hi){lo=lo*.8;hi=Math.max(hi*1.2,1);}let pad=(hi-lo)*.1||1;hi+=pad;lo=Math.max(0,lo-pad);
  const W=700,H=205,L=45,R=12,T=14,B=30;let x=i=>L+i*(W-L-R)/Math.max(1,values.length-1),y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const points=values.map((v,i)=>[x(i),y(v)]),line=points.map(p=>p.join(',')).join(' '),fill=`${x(0)},${H-B} ${line} ${x(values.length-1)},${H-B}`;
  let ticks=[0,.25,.5,.75,1].map(t=>`<line class="chart-grid" x1="${L}" y1="${T+(H-T-B)*t}" x2="${W-R}" y2="${T+(H-T-B)*t}"/><text class="chart-label" x="${L-7}" y="${T+(H-T-B)*t+3}" text-anchor="end">${Math.round(hi-(hi-lo)*t).toLocaleString('en-US')}</text>`).join('');
  let labels=[0,Math.floor((data.length-1)/2),data.length-1].map(i=>`<text class="chart-label" x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(shortDate(data[i].date).slice(5))}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(kind)} chart with ${data.length} data points">${ticks}<polygon class="chart-fill" points="${fill}"/><polyline class="chart-line" points="${line}"/>${points.map((p,i)=>i===points.length-1?`<circle class="chart-dot" cx="${p[0]}" cy="${p[1]}" r="4"/>`:'').join('')}${labels}</svg>`;
}

function pcHealthGauge(name,value,limit){
 const observed=value!==null&&value!==undefined&&value!==''&&Number.isFinite(Number(value));
 const n=observed?Number(value):null, level=!observed?'unconfigured':n>=limit?'critical':n>=limit*.8?'elevated':'normal';
 return `<div class="pc-health-bar"><div class="pc-health-caption"><strong>${esc(name)}</strong><span>${observed?esc(n.toFixed(1))+'%':'Not measured'}</span></div><div class="pc-track"><div class="pc-fill ${level}" style="width:${observed?Math.min(100,Math.max(0,n)):0}%"></div></div></div>`;
}

 if(kind==='sale')fields=field('date','Reporting date','date',true,null,date)+field('inside_sales','Inside sales ($)','number',true,null,'0')+field('customers','Customer count','number',true,null,'0')+field('transactions','Transactions','number',true,null,'0')+field('fuel_gallons','Fuel gallons','number',true,null,'0')+field('fuel_sales','Fuel sales ($)','number',true,null,'0')+field('lottery_sales','Lottery sales ($)','number',true,null,'0')+field('car_wash_sales','Car wash sales ($)','number',true,null,'0')+field('notes','Notes','textarea');
 if(kind==='task')fields=field('title','Task title','text',true)+field('assigned_to','Assigned to')+field('due_date','Due date','date')+field('priority','Priority','text',true,['Low','Medium','High'],'Medium')+field('notes','Instructions','textarea');
 if(kind==='incident')fields=field('date','Incident date','date',true,null,date)+field('category','Category','text',true,['Theft','Safety','Equipment','Cash variance','Customer complaint','Other'],'Equipment')+field('severity','Severity','text',true,['Low','Medium','High'],'Medium')+field('description','What happened?','textarea',true);
 if(kind==='vendor')fields=field('date','Delivery date','date',true,null,date)+field('vendor','Vendor','text',true)+field('invoice_number','Invoice number')+field('invoice_total','Original invoice total ($)','number',true,null,'0')+field('discount','Discount ($)','number',true,null,'0')+field('credit','Credit ($)','number',true,null,'0')+field('audit_total','Audited amount ($)','number',true,null,'0')+field('status','Status','text',true,['Open','Followed up','Working','Resolved'],'Open')+field('notes','Issue / follow-up notes','textarea');
 if(kind==='expense')fields=field('date','Expense date','date',true,null,date)+field('category','Expense category','text',true,['Payroll','Utilities','Insurance','Maintenance','Store supplies','Bank fees','Taxes','Rent','Other'],'Maintenance')+field('vendor','Payee / vendor')+field('amount','Amount ($)','number',true,null,'0')+field('payment_method','Payment type','text',true,['EFT','Check','Cash','Card','Other'],'EFT')+field('notes','Notes','textarea');
 if(kind==='metric')fields=field('date','Observation date','date',true,null,date)+field('area','Operations area','text',true,['ATM','Lottery','Fuel','Car Wash','Power / Internet','Equipment','Waste','Payroll','Other'],'ATM')+field('metric','Metric name','text',true)+field('value','Value','number',true,null,'0')+field('unit','Unit (count, $, minutes, gallons...)')+field('notes','Notes','textarea');
 if(kind==='compliance')fields=field('name','Requirement / permit','text',true)+field('category','Category','text',true,['Tobacco','Alcohol','Hemp / Vape','Fuel / UST','Food','Lottery','Sales tax','Payroll tax','Annual report','Insurance','Fire / Safety','Other'],'Fuel / UST')+field('due_date','Verified due date','date',true,null,date)+field('owner','Responsible person')+field('notes','Reference / official source','textarea');
 if(kind==='inventory')fields=field('sku','UPC / SKU')+field('item_name','Item name','text',true)+field('department','Department')+field('on_hand','On hand','number',true,null,'0')+field('reorder_point','Reorder point','number',true,null,'0')+field('unit_cost','Unit cost ($)','number',true,null,'0')+field('retail_price','Retail price ($)','number',true,null,'0');
 if(kind==='event')fields=field('event_date','Reported date','date',true,null,date)+field('category','Category','text',true,['Roadwork','Weather','Regulation','Competitor','Event','Supply','Economy','Other'],'Roadwork')+field('title','Event title','text',true)+field('severity','Severity','text',true,['Low','Medium','High'],'Medium')+field('start_date','Start date','date')+field('end_date','End date','date')+field('status','Status','text',true,['Planned','Active','Closed'],'Planned')+field('source_url','Official source link','url')+field('description','Impact / details','textarea');
 $('#modal-mount').innerHTML=`<div class="modal-backdrop" data-action="close-modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-top"><h3>${esc(title)}</h3><button class="modal-close" type="button" data-action="close-modal">×</button></div><form id="entry-form" data-kind="${esc(kind)}"><div class="form-grid">${fields}</div><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">Cancel</button><button type="submit" class="btn btn-primary">Save record</button></div></form></div></div>`;
}
async function load(storeId){
 if(state.busy)return false;state.busy=true;let success=false;
 try {let data=await api('getOmAiDashboard',storeId);state.data=data;state.storeId=data.store.store_id;renderShell();success=true;}
 catch(e){if(!state.data){$('#app').innerHTML=`<div style="padding:8vw"><h1>OM AI is unavailable</h1><p>${esc(e.message)}</p><button class="btn" onclick="location.reload()">Try again</button></div>`;}else notify(e.message,true);}
 finally{state.busy=false;}
 return success;
}
document.addEventListener('click',async event=>{
 const nav=event.target.closest('[data-nav]');if(nav){state.view=nav.dataset.nav;renderView();return;}
 const b=event.target.closest('[data-action],[data-fuel-task],[data-camera-assign],[data-job-review],[data-job-ai]');if(!b)return;
 const act=b.dataset.action;
 if(act==='close-modal'){ $('#modal-mount').innerHTML='';return; }
 if(act==='close-modal-bg'&&event.target===b){$('#modal-mount').innerHTML='';return;}
 if(act && act.startsWith('add:')){showForm(act.slice(4));return;}
 if(b.dataset.jobAi){
   if(demo){notify('AI review is disabled in the fictional preview.');return;}
   const provider=prompt('Optional AI adviser for '+b.dataset.jobAi+': type gemini or openai. Only sanitized job metadata will be sent.','gemini');
   if(provider===null)return;
   if(!['gemini','openai'].includes(provider.toLowerCase())){notify('Choose gemini or openai.',true);return;}
   b.disabled=true;
   try{const r=await api('omAiReviewJob',state.storeId,b.dataset.jobAi,provider.toLowerCase());
     $('#modal-mount').innerHTML=`<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-top"><h3>AI task assessment · ${esc(r.provider)}</h3><button class="modal-close" data-action="close-modal">×</button></div><pre style="white-space:pre-wrap;overflow:auto;max-height:52vh">${esc(r.answer)}</pre><div class="notice warn">${esc(r.warning)}</div><button class="btn" data-action="close-modal">Close</button></div></div>`;
   }catch(e){notify(e.message,true);}finally{b.disabled=false;}return;
 }
 if(b.dataset.jobReview){
   if(demo){notify('Demo only: reviews do not change real jobs.');return;}
   const selection=prompt('Review '+b.dataset.jobReview+'. Enter Acknowledged, Investigating, Escalated, or Verified:','Investigating');
   if(selection===null)return;
   if(!['Acknowledged','Investigating','Escalated','Verified'].includes(selection)){notify('Choose an allowed review status.',true);return;}
   const note=prompt('Add a brief audit note (no passwords or personal data):','')||'';
   try{await api('reviewOmAiJob',state.storeId,b.dataset.jobReview,selection,note);await load(state.storeId);notify('Review saved. The job has not been executed or completed.');}
   catch(e){notify(e.message,true);}return;
 }
 if(b.dataset.cameraAssign){
   if(demo){notify('Demo only: connect private Apps Script and authorized accounts to assign observers.');return;}
   const observer=prompt('Name or team responsible for '+b.dataset.cameraAssign+':','');
   if(observer===null||!observer.trim())return;
   try{await api('assignOmCameraObserver',state.storeId,b.dataset.cameraAssign,observer);await load(state.storeId);notify('Camera observer saved.');}catch(e){notify(e.message,true);}return;
 }
 if(b.dataset.fuelTask){
   if(demo){notify('Preview only.',true);return;}
   let link=prompt('Paste the HTTPS link to the checked source page or screenshot (required to close task):','');
   if(link===null)return;
   if(!/^https:\/\//i.test(link)){notify('A valid HTTPS evidence link is required.',true);return;}
   try{await api('setOmAiFuelTaskStatus',state.storeId,b.dataset.fuelTask,'Completed',link);await load(state.storeId);notify('Fuel source task completed with evidence.');}
   catch(e){notify(e.message,true);} return;
 }
 if(act==='extractFuel'){
   if(demo){notify('Demo: extraction is available only after deploying the private Apps Script app and configuring Gemini.',true);return;}
   const id=prompt('Paste the Google Drive file ID or file link for your OWN authorized fuel report screenshot. The file will be sent to your configured Gemini account for a review-only extraction.','');
   if(!id)return;
   b.disabled=true;
   try{const draft=await api('previewOmFuelScreenshot',state.storeId,id);
     $('#modal-mount').innerHTML=`<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-top"><h3>Fuel screenshot • Review draft</h3><button class="modal-close" data-action="close-modal">×</button></div><div class="notice warn">${esc(draft.warning)}</div><pre style="max-height:48vh;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f7fb;padding:14px;border-radius:10px">${esc(JSON.stringify(draft,null,2))}</pre><div class="modal-actions"><button class="btn" data-action="close-modal">Close and verify values</button></div></div></div>`;
   }catch(e){notify(e.message,true);}finally{b.disabled=false;}return;
 }
 if(act==='refresh'){let ok=await load(state.storeId);if(ok)notify(demo?'Demo preview refreshed.':'Dashboard read from private Sheet.');return;}
 if(act==='refreshSources'){
  if(demo){notify('Preview mode: no live source requests are made.');return;}
  b.disabled=true;b.textContent='Refreshing sources…';
  try{let r=await api('refreshOmAiSources',state.storeId);await load(state.storeId);notify(r.sources.map(x=>x.source+': '+x.status).join(' · '));}catch(e){notify(e.message,true);}finally{b.disabled=false;b.textContent='↻ Refresh sources';}return;
 }
});
document.addEventListener('input',event=>{
 if(event.target.id==='scenario-range'){state.scenario=Number(event.target.value);let f=state.data.forecast,base=f.points.reduce((t,x)=>t+(Number(x.expected)||0),0);let label=$('#scenario-label'),val=$('#scenario-value');if(label)label.textContent=(state.scenario>0?'+':'')+state.scenario+'%';if(val)val.textContent=fmtMoney(base*(1+state.scenario/100));}
});
document.addEventListener('change',async event=>{
 if(event.target.id==='store-select'){await load(event.target.value);return;}
 if(event.target.matches('[data-compliance]')){let select=event.target;select.disabled=true;try{await api('setOmAiComplianceStatus',state.storeId,select.dataset.compliance,select.value);await load(state.storeId);notify('Compliance status saved.');}catch(e){notify(e.message,true);select.disabled=false;}return;}
 if(event.target.matches('[data-cam-check]')){
   const sel=event.target;sel.disabled=true;
   try{await api('setOmCameraCheckStatus',state.storeId,sel.dataset.camCheck,sel.value);await load(state.storeId);notify('Camera check status saved.');}
   catch(e){notify(e.message,true);sel.disabled=false;}return;
 }
 if(event.target.matches('[data-task]')){
  let select=event.target;select.disabled=true;
  try{await api('setOmAiTaskStatus',state.storeId,select.dataset.task,select.value);await load(state.storeId);notify('Task status saved.');}catch(e){notify(e.message,true);select.disabled=false;}
 }
});
document.addEventListener('submit',async event=>{
 if(event.target.id==='entry-form'){
   event.preventDefault();let form=event.target,kind=form.dataset.kind,payload=Object.fromEntries(new FormData(form).entries());payload.store_id=state.storeId;
   let btn=form.querySelector('[type=submit]');btn.disabled=true;btn.textContent='Saving…';
   try{let result=kind==='fuelObservation'?await api('saveOmAiFuelObservation',state.storeId,payload):kind==='fuelReport'?await api('saveOmAiFuelReport',state.storeId,payload):await api('saveOmAiRecord',kind,payload);if(!result.ok)throw Error(result.answer||'Record not saved.');$('#modal-mount').innerHTML='';await load(state.storeId);notify('Saved record '+result.id);}catch(e){notify(e.message,true);btn.disabled=false;btn.textContent='Save record';}
   return;
 }
 if(event.target.id==='chat-form'){
   event.preventDefault();let form=event.target,q=new FormData(form).get('question');if(!String(q).trim())return;
   state.chat.push({who:'user',text:String(q)});form.reset();renderView();
   try{let res=await api('askOmAi',state.storeId,q);state.chat.push({who:'ai',text:res.answer||'No answer was returned.'});}catch(e){state.chat.push({who:'ai',text:'AI service unavailable: '+e.message});}
   renderView();let box=$('#chat-messages');if(box)box.scrollTop=box.scrollHeight;
 }
});
load(null);
})();
</script>
</body></html>
